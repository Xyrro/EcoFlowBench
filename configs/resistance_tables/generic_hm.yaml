# generic_hm — continuous human-modification transform: R = 1 + a * gHM^b
# Form follows the practice of deriving mammal movement resistance from the global Human
# Modification index (Brennan et al. 2022, Science 376:1101, doi:10.1126/science.abl8974, used
# gHM-based resistance with Omniscape); the exponent/scale here are EcoFlowBench choices so that
# gHM = 0 -> 1 and gHM = 1 -> 1000 (a convex transform emphasising heavily modified land).
# gHM source: Kennedy et al. 2019, Global Change Biology 25:811, doi:10.1111/gcb.14549.
table_id: generic_hm
version: 1
description: "R = 1 + 999 * gHM^2; open water is a barrier; WorldCover NoData is NoData"
citations:
  - "Brennan A. et al. (2022) Functional connectivity of the world's protected areas. Science 376:1101-1104. doi:10.1126/science.abl8974"
  - "Kennedy C.M. et al. (2019) Managing the middle: a shift in conservation priorities based on the global human modification gradient. Global Change Biology 25:811-826. doi:10.1111/gcb.14549"
r_max: 1000
base: ghm
ghm_base: {a: 999.0, b: 2.0}
water: {mode: barrier, value: 1000}
nodata_classes: []
