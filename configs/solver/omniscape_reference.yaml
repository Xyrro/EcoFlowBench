# Reference Omniscape.jl settings for task T4. Verified against Omniscape.jl 0.6.2 (src/config.jl).
# radius / block_size are per resolution tier (docs/task_specification.md §3.5).
preset_id: omniscape_reference_v1
solver_name: Omniscape.jl
solver_version: "0.6.2"
julia_version: "1.11.3"

solver: cholmod                      # reference (2026-09-05): cg+amg aborted a whole T4 solve on a high-contrast
                                     # landscape (window CG residual 1.4e-4 > Circuitscape's hard-coded 1e-4 limit)
precision: double
connect_four_neighbors_only: false
resistance_is_conductance: false
source_from_resistance: false        # source strength raster is an explicit input
source_threshold: 0.0                # pixels with source <= threshold are never targets
r_cutoff: .inf                       # no resistance-based source cutoff (sources given explicitly)
buffer: 0
calc_flow_potential: true
calc_normalized_current: true
correct_artifacts: true              # Omniscape's block-artefact correction (recorded, kept at default)
mask_nodata: true
write_raw_currmap: true
parallelize: false                   # parallelism is across samples
parallel_batch_size: 10

# per-tier window geometry, pixels (block_size must be odd). Fidelity study 2026-09-05
# (docs/dataset_plan.md §7, 3 samples per tier, CHOLMOD): coarsening XL 17->33 changes cum_current by
# 2.5-2.9 % relative L2 and XXL 33->65 by 5.9-11.9 % (rejected, > 1 %); the Phase-5 blocks deviate from
# the exact block-1 map by 4.5 % (S, b/r 0.19) and 2.0 % (M, b/r 0.16). Adopted rule: block = largest odd
# integer <= radius/10 (b/r <= 0.10). Measured/estimated seconds per T4 solve in the comments.
tiers:
  S:   {radius: 16,  block_size: 1}     # exact; 52 s measured
  M:   {radius: 32,  block_size: 3}     # ~134 s (b1 measured 630-1548 s, b5 48 s)
  L:   {radius: 64,  block_size: 5}     # ~577 s (b9 measured 178 s)
  XL:  {radius: 128, block_size: 11}    # ~1 900 s (b17 measured 794 s)
  XXL: {radius: 256, block_size: 25}    # ~7 800 s (b33 measured 4 468 s) -> one XXL sample per 4 h job
# Phase-5 alternative (b/r 0.13-0.19, ~3.3x cheaper overall): S 3, M 5, L 9, XL 17, XXL 33 — kept in
# configs/datasets/v1_0.yaml as `omniscape_options.phase5`; the mini dataset was generated with it.
