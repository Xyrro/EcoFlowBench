# Reference Omniscape.jl settings for task T4. Verified against Omniscape.jl 0.6.2 (src/config.jl).
# radius / block_size are per resolution tier (docs/task_specification.md §3.5).
preset_id: omniscape_reference_v1
solver_name: Omniscape.jl
solver_version: "0.6.2"
julia_version: "1.11.3"

solver: cholmod                      # reference (2026-09-05): cg+amg aborted a whole T4 solve on a high-contrast
                                     # landscape (window CG residual 1.4e-4 > Circuitscape's hard-coded 1e-4 limit)
precision: double
connect_four_neighbors_only: false
resistance_is_conductance: false
source_from_resistance: false        # source strength raster is an explicit input
source_threshold: 0.0                # pixels with source <= threshold are never targets
r_cutoff: .inf                       # no resistance-based source cutoff (sources given explicitly)
buffer: 0
calc_flow_potential: true
calc_normalized_current: true
correct_artifacts: true              # Omniscape's block-artefact correction (recorded, kept at default)
mask_nodata: true
write_raw_currmap: true
parallelize: false                   # parallelism is across samples
parallel_batch_size: 10

# per-tier window geometry, pixels (block_size must be odd). Measured 2026-09-05 (CHOLMOD, 1 process,
# 4 cores, synthetic landscapes): S 6.2 s median (max 20 s); M 48 s (max 70 s); L 178 s (max 334 s);
# XL with radius 128 / block 17 took 794 s median (max 1252 s) -> exceeds the 10-minute-per-solve
# target, so XL uses block 33 (≈ 3.8x fewer windows) and XXL block 65. Cost ∝ (H·W / block²) × window solve.
# XXL measured with radius 256 / block 33: 4 468 s (74 min) for one solve, 2.4 GB RSS -> block 65 (≈ 4x fewer
# windows, ≈ 19 min estimated) is adopted so an XXL sample fits comfortably in a 4 h job.
tiers:
  S:   {radius: 16,  block_size: 3}     # 1.6 km window at 100 m; 1 764 windows
  M:   {radius: 32,  block_size: 5}     # 2 601 windows
  L:   {radius: 64,  block_size: 9}     # 3 249 windows
  XL:  {radius: 128, block_size: 33}    # 961 windows (was 17 -> 3 600 windows, 13 min median)
  XXL: {radius: 256, block_size: 65}    # 992 windows (b33 measured: 3 844 windows, 74 min)
